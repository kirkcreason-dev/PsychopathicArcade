<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" role="img" aria-labelledby="ticket-pickup-title ticket-pickup-desc">
 <title id="ticket-pickup-title">Show ticket pickup</title>
 <desc id="ticket-pickup-desc">Amber admission ticket with circular side notches, dark ICP/JCW event text and a tear-off barcode. The ticket is drawn at a slight angle with a solid dimensional edge.</desc>
 <defs>
  <linearGradient id="ticket-pickup-steel" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#60686c"/><stop offset=".48" stop-color="#333b40"/><stop offset="1" stop-color="#1c2227"/></linearGradient>
  <linearGradient id="ticket-pickup-bone" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff7e6"/><stop offset="1" stop-color="#c5b9a0"/></linearGradient>
  <linearGradient id="ticket-pickup-green" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#d5ff72"/><stop offset=".56" stop-color="#b9ef42"/><stop offset="1" stop-color="#719c26"/></linearGradient>
  <linearGradient id="ticket-pickup-red" x1="0" y1="0" x2=".6" y2="1"><stop stop-color="#ee6264"/><stop offset=".5" stop-color="#ce3647"/><stop offset="1" stop-color="#762733"/></linearGradient>
  <linearGradient id="ticket-pickup-gold" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#fff09e"/><stop offset=".48" stop-color="#f5b94c"/><stop offset="1" stop-color="#a66b29"/></linearGradient>
 </defs>
