 <circle cx="155" cy="126" r="49" fill="#171d21" stroke="#f4ebd6" stroke-width="4"/>
 <path d="m155 91 11 24 27 4-20 19 5 27-23-13-23 13 5-27-20-19 27-4Z" fill="url(#destination-pin-bone)" stroke-width="4"/>
 <path d="M100 88q11-17 29-21" fill="none" stroke="#ffa79a" stroke-width="5"/>
