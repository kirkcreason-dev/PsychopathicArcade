name: Arcade checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=line
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !success() }}
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
